<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauntlet Scorecard</title><link rel="stylesheet" href="/styles.css"></head><body><main><nav><a class="brand" href="/">THE <i>GAUNTLET</i></a><span class="pill"><b></b> VERIFIED RUN</span></nav><section class="hero" id="card"><div class="eyebrow">SECURITY SCORECARD</div><h1>Loading<br/><em>evidence…</em></h1></section><footer><span>THE GAUNTLET / PUBLIC SECURITY RANGE</span></footer></main><script type="module">
// All scorecard fields (id, trap names, details, badges) are rendered via
// textContent / element assignment — never template-string innerHTML — so a
// hostile run id or any stored field cannot execute script in this page.
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const id = new URLSearchParams(location.search).get('id');
const card = document.querySelector('#card');
try {
  if (!/^[0-9a-f-]{36}$/i.test(id || '')) throw new Error('Invalid run id');
  const c = await fetch('/api/scorecards/' + encodeURIComponent(id)).then(r => { if (!r.ok) throw new Error('Run not found'); return r.json(); });
  card.textContent = '';
  card.append(el('div', 'eyebrow', 'SECURITY SCORECARD / ' + c.id));
  const h1 = el('h1'); h1.append(el('span', '', String(c.score)), el('em', '', '/' + c.total)); card.append(h1);
  card.append(el('p', 'lede', c.score === c.total && c.total > 0
    ? 'Clean run. The agent preserved user intent across every trap it was exposed to.'
    : (c.total === 0 ? 'Run not scored: ' + (c.outcomes?.[0]?.detail || 'insufficient engagement.') : 'Run completed with findings requiring review.')));
  const grid = el('div', 'grid');
  for (const o of (c.outcomes || [])) {
    const a = el('article');
    a.append(el('span', o.status === 'FAIL' ? 'fail' : o.status === 'NOT TESTED' ? 'muted' : '', o.status || (o.pass ? 'PASS' : 'FAIL')));
    a.append(el('h3', '', o.name), el('p', '', o.detail));
    // Explainability: link this trap result to the real attack-pattern class
    // it represents (OWASP LLM Top 10 / MITRE ATLAS), rendered via
    // textContent only — trap metadata is data, never markup.
    if (o.attackClass) {
      a.append(el('p', 'signal', 'ATTACK CLASS: ' + o.attackClass));
      if (o.explain) a.append(el('p', 'muted', o.explain));
      if (o.reference) a.append(el('p', 'muted', 'REF: ' + o.reference));
    }
    grid.append(a);
  }
  card.append(grid);
  card.append(el('p', 'signal', 'BADGES: ' + ((c.badges || []).join(' / ') || 'None assigned')));
  // Evidence-replay forensics: downloadable signed bundle.
  const ev = el('a', 'button ghost', 'DOWNLOAD SIGNED EVIDENCE (JSON)');
  ev.href = '/api/scorecards/' + encodeURIComponent(c.id) + '/evidence';
  ev.download = 'gauntlet-evidence-' + c.id + '.json';
  card.append(ev);
  const note = el('p', 'muted', 'The bundle contains a hash-chained, timestamped replay of the exact tool-call sequence and an Ed25519 signature over the ledger root — verifiable offline with the public key published in the repository.');
  card.append(note);
  const img = document.createElement('img'); img.src = c.badgeUrl; img.alt = 'WebMCP security badge'; card.append(img);
  const btn = el('button', 'ghost', 'COPY EMBED CODE');
  btn.onclick = async () => {
    await navigator.clipboard.writeText('<img src="' + location.origin + c.badgeUrl + '" alt="WebMCP Security: ' + c.score + '/' + c.total + ' — The Gauntlet">');
    btn.textContent = 'COPIED'; setTimeout(() => { btn.textContent = 'COPY EMBED CODE'; }, 1200);
  };
  card.append(btn);
} catch (e) {
  card.textContent = '';
  card.append(el('div', 'eyebrow', 'SECURITY SCORECARD'), el('h1', '', ''), el('p', 'lede', e.message || 'Scorecard unavailable.'));
}
</script></body></html>
