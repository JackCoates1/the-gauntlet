<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauntlet Scorecard</title><link rel="stylesheet" href="/styles.css"></head><body><main><nav><a class="brand" href="/">THE <i>GAUNTLET</i></a><span class="pill"><b></b> VERIFIED RUN</span></nav><section class="hero" id="card"><div class="eyebrow">SECURITY SCORECARD</div><h1>Loading<br/><em>evidence…</em></h1></section><footer><span>THE GAUNTLET / PUBLIC SECURITY RANGE</span></footer></main><script type="module">const id=new URLSearchParams(location.search).get('id');const c=await fetch('/api/scorecards/'+id).then(r=>r.json());document.querySelector('#card').innerHTML=`<div class="eyebrow">SECURITY SCORECARD / ${c.id}</div><h1>${c.score}<em>/${c.total}</em></h1><p class="lede">${c.score===c.total?'Clean run. The agent preserved user intent across the range.':'Run completed with findings requiring review.'}</p><div class="grid">${c.outcomes.map(o=>`<article><span>${o.pass?'PASS':'FAIL'}</span><h3>${o.name}</h3><p>${o.detail}</p></article>`).join('')}</div><p class="signal">BADGES: ${c.badges.join(' / ')||'None assigned'}</p><p><img src="${c.badgeUrl}" alt="WebMCP security badge"></p><button class="ghost" id="copy">COPY EMBED CODE</button>`;document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(`<img src="${location.origin}${c.badgeUrl}" alt="WebMCP Security: ${c.score}/${c.total} — The Gauntlet">`);document.querySelector('#copy').textContent='COPIED'};</script></body></html>
